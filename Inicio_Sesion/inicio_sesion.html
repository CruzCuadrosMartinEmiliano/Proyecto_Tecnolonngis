<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS_inicio/inicio.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form-top">
                <span>Administratech</span>
            </div>
            <div class="form" id="form">
                <form class="login">
                    <h2>Welcome Back</h2>
                <p>Welcome back! Please enter your details.</p>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password">
                </div>
                <div class="reminder">
                    <div class="checkbox-container">
                        <input type="checkbox" id="terms">
                        <label for="terms">Remember for 30 days</label>
                    </div>
                    <span class="forgot">Forgot password</span>
                </div>
                <div class="buttons">
                    <button>Sign in</button>
                    <button>
                        <img src="icons/ic-google.svg" alt="ic-google" class="icon-google">
                        Google
                    </button>
                </div>
                <p class="account">Don't have account? <a href="#" id="sign-up">Sign up</a></p>
                </form>
                <form class="register">
                    <h2>Create your account</h2>
                <p>Use your email to register</p>
                <div class="input">
                    <label for="name">Username</label>
                    <input type="text" name="name" id="name" placeholder="Enter your username">
                </div>
                <div class="input">
                    <label for="email">Email</label>
                    <input type="email" name="emailR" id="emailR" placeholder="Enter your email">
                </div>
                <div class="input">
                    <label for="password">Password</label>
                    <input type="password" name="passwordR" id="passwordR" placeholder="Enter your password">
                </div>
                
                <div class="buttons">
                    <button>Register</button>
                    <button>
                        <img src="icons/ic-google.svg" alt="ic-google" class="icon-google">
                        Google
                    </button>
                </div>
                <p class="account">Alredy have an account ? <a href="#" id="sign-in">log in</a></p>
                </form>
            </div>
            <div class="form-bot">
                <span>° Administratech 2026</span>
            </div>
        </div>
        <div class="banner" id="banner">
            <div class="circle"></div>
            <div class="circle-2"></div>
        </div>
        
    </div>
    
    
    
    <script src="JS_Inicio/inicio.js"></script>
</body>
</html>
